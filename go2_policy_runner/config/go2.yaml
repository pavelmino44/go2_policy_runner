#
# Default gains, the folded "lie" pose and the remote-controller combinations are taken from
# unitree_rl_lab deploy/robots/go2/config/config.yaml (Copyright (c) 2025, Unitree Robotics Co., Ltd.,
# Apache-2.0). The "stand" pose is the default joint position of the unitree_rl_lab Go2 asset.
# Joint limits are taken from unitree_mujoco unitree_robots/go2/go2.xml
# (Copyright (c) 2016-2024 HangZhou YuShu TECHNOLOGY CO.,LTD. ("Unitree Robotics"), BSD-3-Clause).
#
# go2_policy_runner configuration for Unitree Go2.
# The SAME file is used in unitree_mujoco and on the real robot.
#
# Motor order everywhere in this file is the SDK order:
#   0 FR_hip  1 FR_thigh  2 FR_calf   3 FL_hip  4 FL_thigh  5 FL_calf
#   6 RR_hip  7 RR_thigh  8 RR_calf   9 RL_hip 10 RL_thigh 11 RL_calf
#
# Remote-controller expressions (unitree_rl_lab deploy syntax):
#   "LT + A.on_pressed", "start.on_pressed", "LT(2s) + down", "X | Y", "!A" ...
#   keys: LT RT LB RB A B X Y up down left right start back F1 F2 lx ly rx ry
# An empty expression "" means: transition allowed only via the ~/set_mode service.

policy_controller:
  ros__parameters:
    num_motors: 12
    control_rate: 500.0          # [Hz] lowcmd publish rate; step_dt * control_rate must be an integer
    lowstate_timeout: 0.1        # [s] no lowstate for this long -> fallback (passive)
    cmd_vel_timeout: 0.5         # [s] no cmd_vel for this long -> zero velocity command
    # Remote for the FSM expressions:
    #   lowstate - Unitree wireless remote (LowState.wireless_remote)
    #   topic    - unitree_go/WirelessController on `remote` (input_teleop: DualShock 4 / keyboard)
    # Set by the launch argument input:=...
    remote_source: lowstate
    remote_timeout: 0.5          # [s] remote topic older than this -> nothing pressed
    state_rate: 10.0             # [Hz] ~/state publish rate
    publish_policy_step: true    # publish ~/policy_step (obs / actions) for logging
    onnx_threads: 1

    # Built-in sport mode handling (robot RPC over /api/motion_switcher/*):
    #   auto    - release it if the service exists (robot), skip if not (simulation)
    #   release - the service must exist (fail otherwise)
    #   skip    - never touch it
    motion_switcher:
      mode: auto
      discovery_timeout: 3.0
      call_timeout: 5.0

    # Listen to lowcmd before taking over; abort if someone else publishes it (0 = disable).
    lowcmd_check_duration: 0.5

    # Relative policy_dir values are resolved against policy_root
    # (default: <share>/go2_policy_runner/policies). Also accepted: absolute paths and
    # package://<pkg>/<path>. A directory without exported/ selects its latest run sub-folder,
    # e.g. unitree_rl_lab/logs/rsl_rl/unitree_go2_velocity.
    policy_root: ""
    default_policy_dir: ""       # set by the launch argument policy_dir:=...

    # Hard limits for position targets of every mode (SDK order), from go2_description / go2.xml.
    # Remove the block to disable.
    joint_limits:
      lower: [-1.0472, -1.5708, -2.7227,  -1.0472, -1.5708, -2.7227,  -1.0472, -0.5236, -2.7227,  -1.0472, -0.5236, -2.7227]
      upper: [ 1.0472,  3.4907, -0.83776,  1.0472,  3.4907, -0.83776,  1.0472,  4.5379, -0.83776,  1.0472,  4.5379, -0.83776]

    poses:
      lie:   [0.0, 1.36, -2.65,  0.0, 1.36, -2.65,  0.0, 1.36, -2.65,  0.0, 1.36, -2.65]
      # = default_joint_pos of the unitree_rl_lab Go2 velocity task
      stand: [-0.1, 0.8, -1.5,   0.1, 0.8, -1.5,   -0.1, 1.0, -1.5,   0.1, 1.0, -1.5]

    fsm:
      modes: [passive, stand, sit, walk]
      initial: passive
      fallback: passive            # must be of type passive; reachable from every mode

      passive:
        type: passive
        kd: [3.0, 3.0, 3.0, 3.0, 3.0, 3.0, 3.0, 3.0, 3.0, 3.0, 3.0, 3.0]
        transitions:
          stand: "LT + A.on_pressed"

      stand:
        type: fix_stand
        kp: [60.0, 80.0, 80.0, 60.0, 80.0, 80.0, 60.0, 80.0, 80.0, 60.0, 80.0, 80.0]
        kd: [5.0, 4.0, 4.0, 5.0, 4.0, 4.0, 5.0, 4.0, 4.0, 5.0, 4.0, 4.0]
        sequence: [lie, stand]     # fold the legs first, then stand up
        durations: [1.0, 1.5]      # [s] to reach each pose
        interpolation: smooth      # smooth | linear
        # Optional sequences that depend on the previous mode. Coming from walk the robot is
        # already up: go straight to the standing pose instead of lying down first.
        from:
          walk:
            sequence: [stand]
            durations: [1.0]
        transitions:
          passive: "LT + B.on_pressed"
          walk: "start.on_pressed"
          sit: "LT + down.on_pressed"

      sit:
        type: fix_stand
        kp: [60.0, 80.0, 80.0, 60.0, 80.0, 80.0, 60.0, 80.0, 80.0, 60.0, 80.0, 80.0]
        kd: [5.0, 4.0, 4.0, 5.0, 4.0, 4.0, 5.0, 4.0, 4.0, 5.0, 4.0, 4.0]
        sequence: [lie]
        durations: [2.0]
        transitions:
          passive: "LT + B.on_pressed"
          stand: "LT + A.on_pressed"

      walk:
        type: rl_policy
        policy_dir: ""             # "" -> default_policy_dir
        max_tilt: 1.0              # [rad] fall detection -> passive (<= 0 disables)
        transitions:
          passive: "LT + B.on_pressed"
          stand: "LT + A.on_pressed"
          sit: "LT + down.on_pressed"

remote_teleop:
  ros__parameters:
    rate: 50.0
    max_vx: 1.0          # [m/s]   left stick up
    max_vy: 0.5          # [m/s]   left stick left
    max_wz: 1.0          # [rad/s] right stick left
    deadzone: 0.05
    publish_when_idle: false   # publish zeros even when no remote frame is present

# DualShock 4 / keyboard instead of the Unitree remote (launch argument input:=dualshock4|keyboard).
# Publishes `remote` (buttons + sticks in the Unitree layout, for the FSM) and `cmd_vel`.
input_teleop:
  ros__parameters:
    device: dualshock4   # dualshock4 | keyboard (set by the launch argument input:=...)
    device_path: ""      # e.g. /dev/input/event7; "" = find it automatically
    device_name: ""      # substring of the device name to choose between several devices
    rate: 50.0
    max_vx: 1.0          # [m/s]
    max_vy: 0.5          # [m/s]
    max_wz: 1.0          # [rad/s]
    deadzone: 0.05
    gamepad:
      trigger_threshold: 0.5   # L2 / R2 analog value that counts as pressed
    keyboard:
      toggle_key: F12          # switches keyboard control on / off
      grab: true               # while on, other programs get no keys from this keyboard
      stick: 0.5               # stick deflection of the movement keys (fast: 1.0)
      combo_delay: 0.15        # [s] "LT + A": A is pressed this long after LT
      # "<KEY>: <target>": remote buttons joined with +, a stick direction or fast.
      # Key names: Linux KEY_* without the prefix (W, 1, SPACE, UP, LEFTSHIFT, F1, KP0, ...)
      bindings:
        - "W: ly+"
        - "S: ly-"
        - "A: lx-"
        - "D: lx+"
        - "Q: rx-"
        - "E: rx+"
        - "LEFTSHIFT: fast"
        - "SPACE: LT + B"      # passive (damping)
        - "1: LT + A"          # stand
        - "2: start"           # walk
        - "3: LT + down"       # sit
        - "UP: up"
        - "DOWN: down"
        - "LEFT: left"
        - "RIGHT: right"

# Terminal monitor: ros2 run go2_policy_runner robot_monitor --ros-args --params-file <this file>
robot_monitor:
  ros__parameters:
    controller: policy_controller   # name of the controller node
    refresh_rate: 10.0              # [Hz] screen refresh
    nominal_lowstate_rate: 0.0      # [Hz] 0 = use the controller's control_rate
    publish_diagnostics: true       # publish /diagnostics (rqt_robot_monitor)
    thresholds:
      motor_temp: 65.0              # [degC]
      joint_limit_margin: 0.05      # fraction of the joint range
      battery: 20.0                 # [%]
      lowstate_rate_ratio: 0.8      # of the nominal lowstate rate
      tilt_ratio: 0.7               # of max_tilt of the active mode
      inference_ratio: 0.5          # of the policy period
